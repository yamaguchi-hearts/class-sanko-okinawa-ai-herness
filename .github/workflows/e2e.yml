name: E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: pnpmを有効化
        run: corepack enable

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: E2Eテストを実行
        run: pnpm run test:e2e
        env:
          CI: true
